<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #333;
    }
    .info {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #da190b;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
      display: none;
    }
    #status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    #status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    #status.working {
      background: #fff3cd;
      color: #856404;
      display: block;
    }
  </style>
</head>
<body>
  <h2>⚡ Fast Rename</h2>
  
  <div class="info">
    <span id="docInfo">Click to rename all parts</span>
  </div>
  
  <button id="renameBtn">⚡ RENAME ALL NOW</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
